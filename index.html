<script>
const $=id=>document.getElementById(id);
let last=null;

function read(key,def=[]){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(def))}catch(e){return def}}
function write(key,val){localStorage.setItem(key,JSON.stringify(val))}
function num(x){const n=parseFloat(x);return Number.isFinite(n)?n:0}

function normalizeText(text){
 return (text||'').replace(/\u00a0/g,' ').replace(/\r/g,'').replace(/[ \t]+/g,' ');
}
function foldName(s){
 return String(s||'')
   .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
   .replace(/[’'`]/g,'')
   .replace(/[^A-Za-z0-9]+/g,' ')
   .replace(/\s+/g,' ').trim().toLowerCase();
}
function parseMatchDateKey(text){
 const months={gennaio:1,febbraio:2,marzo:3,aprile:4,maggio:5,giugno:6,luglio:7,agosto:8,settembre:9,ottobre:10,novembre:11,dicembre:12};
 let m=String(text||'').match(/\b(\d{1,2})\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+(\d{4})\b/i);
 if(m)return `${m[3]}-${String(months[m[2].toLowerCase()]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
 m=String(text||'').match(/\b(\d{2})\.(\d{2})\.(\d{2,4})\b/);
 if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2]}-${m[1]}`; }
 return '';
}
function cleanName(x){return (x||'').replace(/\s+/g,' ').replace(/^\W+|\W+$/g,'').trim();}
function uniqueNums(str,min=0,max=9999){
 return [...str.matchAll(/\b\d{1,4}\b/g)].map(m=>+m[0]).filter(n=>n>=min&&n<=max);
}
function findPlayers(lines){
 // Prefer an explicit "Player - Player" line, excluding metadata.
 for(const line of lines){
   if(/H2H|FORM|V1|V2|ULTIME|QUOTE|ODDS|MATCH|RISULT|TODAY|OGGI/i.test(line)) continue;
   const m=line.match(/^\s*(.{2,45}?)\s+[-–—]\s+(.{2,45}?)\s*$/);
   if(m){
     const a=cleanName(m[1]),b=cleanName(m[2]);
     if(a.length>2&&b.length>2) return [a,b];
   }
 }
 return ['',''];
}
function parseOdds(text){
 // Scores24 actual copied format:
 // [1 1.67 ...] [2 2.10 ...]
 // Prefer the "Vincitore Partita" section if present.
 const sec=text.match(/Vincitore\s+Partita[\s\S]{0,700}/i);
 const block=sec?sec[0]:text;
 const m1=block.match(/\b1\s+([0-9]+(?:[.,][0-9]+))\b/);
 const m2=block.match(/\b2\s+([0-9]+(?:[.,][0-9]+))\b/);
 if(m1&&m2){
   const a=parseFloat(m1[1].replace(',','.')),b=parseFloat(m2[1].replace(',','.'));
   if(a>1&&b>1&&a<100&&b<100)return [a,b];
 }
 // Fallback for V1/V2 format used by demo/manual input.
 const old=block.match(/V1\s*([0-9]+(?:[.,][0-9]+))\s+V2\s*([0-9]+(?:[.,][0-9]+))/i);
 if(old)return [parseFloat(old[1].replace(',','.')),parseFloat(old[2].replace(',','.'))];
 return [0,0];
}
function parseH2H(text,p1,p2){
 // Actual Scores24 layout:
 // 52%
 // 154 Vittorie
 // 48%
 // 141 Vittorie
 const idx=text.search(new RegExp('\\b'+(p1||'Radim Pavelka').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b[\\s\\S]{0,120}\\b'+(p2||'Jaroslav Prokupek').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'));
 const hidx=text.search(/\bH2H\b/i);
 if(hidx>=0){
   const block=text.slice(hidx,hidx+1200);
   const wins=[...block.matchAll(/\b(\d{1,4})\s+Vittorie\b/gi)].map(m=>+m[1]);
   if(wins.length>=2 && wins[0]>=1 && wins[1]>=1)return [wins[0],wins[1]];
 }
 // Generic fallback: two "Vittorie" counts in the H2H area.
 return [0,0];
}
function findRecentSection(text,player){
 const esc=player.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp('Ultime\\s+partite\\s*:\\s*'+esc,'i');
 const m=re.exec(text);
 if(!m)return '';
 const rest=text.slice(m.index);
 const next=rest.slice(1).search(/Ultime\s+partite\s*:/i);
 return next>=0?rest.slice(0,next+1):rest.slice(0,5000);
}
function parseFormForPlayer(text, targetPlayer, matchDateKey) {
  const out={form:'',wins:0,losses:0,games:0,today:0,confidence:'low',matches:[],setsWon:0,setsLost:0};
  if(!text||!targetPlayer)return out;
  const norm=foldName;
  const targetNorm=norm(targetPlayer);
  const headers=[]; const headerRe=/Ultime\s+partite\s*:\s*([^\r\n]+)/gi; let hm;
  while((hm=headerRe.exec(text))!==null)headers.push(hm);
  if(!headers.length)return out;
  const targetTokens=targetNorm.split(' ').filter(Boolean);
  let best=null,bestScore=0;
  for(const h of headers){
    const hn=norm(h[1]);
    const ht=hn.split(' ').filter(Boolean);
    const hits=targetTokens.filter(t=>ht.includes(t)).length;
    const score=targetTokens.length?hits/targetTokens.length:0;
    if(score>bestScore){bestScore=score;best=h;}
  }
  if(!best||bestScore<0.5)return out;
  const sectionStart=best.index;
  const nextRe=/Ultime\s+partite\s*:/gi; nextRe.lastIndex=sectionStart+best[0].length;
  const next=nextRe.exec(text); const sectionEnd=next?next.index:text.length;
  const section=text.slice(sectionStart,sectionEnd);
  const dates=[]; const dateRe=/\b(\d{1,2}[./-]\d{1,2}[./-]\d{2,4})\b/g; let dm;
  while((dm=dateRe.exec(section))!==null)dates.push({start:dm.index,date:dm[1]});
  const generic=new Set(['czech liga pro','tutti i campionati','tutti i tornei','ultime partite','h2h','forma','risultati','quote','panoramica','classifica','statistiche','partite','oggi','domani']);
  function candidateName(x){
    let v=(x||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
    if(!v||generic.has(norm(v))||v.length<4||v.length>70)return '';
    if(/[0-9:/()[\]{}|<>@#$%]/.test(v))return '';
    if(!/^[A-Za-zÀ-ÖØ-öø-ÿĀ-ž'’.,\- ]+$/.test(v))return '';
    if(v.split(/\s+/).length<2)return '';
    return v;
  }
  for(let i=0;i<dates.length&&out.games<5;i++){
    const startPos=dates[i].start, endPos=i+1<dates.length?dates[i+1].start:section.length;
    const block=section.slice(startPos,endPos);
    const scoreRe=/\b([0-3])\s*(?:-|–|—|:)\s*([0-3])\b|\b([0-3])\s+([0-3])\b/g;
    let sm=null,x;
    while((x=scoreRe.exec(block))!==null){
      const a=Number(x[1]??x[3]),b=Number(x[2]??x[4]);
      if(a!==b&&a<=3&&b<=3&&a+b>=3){sm=x;break;}
    }
    if(!sm)continue;
    const sa=Number(sm[1]??sm[3]),sb=Number(sm[2]??sm[4]);
    const lines=block.slice(0,sm.index).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const counts=new Map(),display=new Map(),order=[];
    for(const raw of lines){
      const n=candidateName(raw);if(!n)continue;
      const k=norm(n); if(!counts.has(k))order.push(k);

   stake:st,result:result||'',pickSide:extra.pickSide||((prob>=.5)?1:2),pick:extra.pick||(prob>=.5?p1:p2),pickOdds:extra.pickOdds||(prob>=.5?od:(extra.o2||0)),pickEv:extra.pickEv??(prob>=.5?ev:(extra.ev2??null)),pickFair:extra.pickFair||(prob>=.5?(1/prob):(1/(1-prob))),h1:extra.h1||0,h2:extra.h2||0,
   f1:extra.f1||'',f2:extra.f2||'',t1:extra.t1||0,t2:extra.t2||0
 });

function setArchiveResult(id,result){
 const a=read('ligaArchive',[]);
 const i=a.findIndex(x=>String(x.id)===String(id));
 if(i<0)return;

}
function renderArchive(){
  const a=read('ligaArchive',[]),w=a.filter(x=>x.result==='W').length,l=a.filter(x=>x.result==='L').length,n=w+l;
  const settled=a.filter(x=>x.result==='W'||x.result==='L');
  const staked=settled.reduce((sum,x)=>sum+Number(x.stake||0),0);
  const pnl=settled.reduce((sum,x)=>{const stake=Number(x.stake||0),od=Number(x.pickOdds||0);if(!stake||od<=1)return sum;return sum+(x.result==='W'?stake*(od-1):-stake)},0);
  const roi=staked?pnl/staked*100:0;
  $('stats').innerHTML=`<div class="box"><small>Match</small><strong>${a.length}</strong></div><div class="box"><small>W</small><strong>${w}</strong></div><div class="box"><small>L</small><strong>${l}</strong></div><div class="box"><small>Win %</small><strong>${n?(w/n*100).toFixed(1):'0.0'}%</strong></div><div class="box"><small>ROI storico</small><strong class="${roi>=0?'pos':'neg'}">${staked?(roi>=0?'+':'')+roi.toFixed(1)+'%':'—'}</strong></div>`;
  $('archiveList').innerHTML=a.length?`
    <div class="archive-table-wrap">
      <table class="archive-table">
        <thead><tr>
          <th class="c-check"></th>
          <th class="c-match">Match</th>
          <th class="c-pick">Pronostico</th>
          <th class="c-prob">Prob.</th>
          <th class="c-odds">Quota</th>
          <th class="c-odds">Fair</th>
          <th class="c-ev">EV</th>
          <th class="c-conf">Aff.</th>
          <th class="c-wl">Esito</th>
        </tr></thead>
        <tbody>
        ${a.map(x=>{
          const prob=((x.prob||0)*100).toFixed(1);
          const q=x.pickOdds?Number(x.pickOdds).toFixed(2):'—';
          const ev=x.pickEv!=null?(x.pickEv>=0?'+':'')+Number(x.pickEv).toFixed(1)+'%':'—';
          const pick=x.pick||(x.prob>=.5?x.p1:x.p2);
          const conf=Number(x.conf)||0;
          const confCls=conf>=60?'conf-high':conf>=45?'conf-mid':'conf-low';
          const wcls=x.result==='W'?'selected-w':'', lcls=x.result==='L'?'selected-l':'';
          return `<tr>
            <td class="c-check"><input class="chk" type="checkbox" value="${x.id}"></td>
            <td class="c-match" title="${x.p1} vs ${x.p2}"><span>${x.p1} – ${x.p2}</span><span class="match-sub">${x.time||'—'}</span></td>
            <td class="c-pick" title="${pick}"><span class="pick">${pick}</span></td>
            <td class="c-prob">${prob}%</td>
            <td class="c-odds">${q}</td>
            <td class="c-odds">${x.pickFair?Number(x.pickFair).toFixed(2):'—'}</td>
            <td class="c-ev ${Number(x.pickEv)>=0?'ev-pos':'ev-neg'}">${ev}</td>
            <td class="c-conf ${confCls}">${conf||'—'}</td>
            <td class="c-wl"><span class="wl"><button class="wlbtn ${wcls}" onclick="setArchiveResult('${x.id}','W')">W</button><button class="wlbtn ${lcls}" onclick="setArchiveResult('${x.id}','L')">L</button></span></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
      <div class="archive-mobile-note">Scorri lateralmente se necessario</div>
    </div>`
    :'<div class="empty">Nessun match archiviato.</div>';
}

function exportCsv(){
 const a=read('ligaArchive',[]);
 if(!a.length){alert('Archivio vuoto.');return}
 const headers=['Data','Competizione','Orario','P1','P2','Prob P1 %','Prob P2 %','Quota P1','Quota P2','EV P1 %','EV P2 %','Pronostico','Quota pronostico','Fair pronostico','EV pronostico %','Affidabilita /100','Stake %','H2H P1','H2H P2','Forma P1','Forma P2','Match oggi P1','Match oggi P2','Esito'];
 const rows=a.map(x=>[
   x.date?new Date(x.date).toLocaleString('it-IT'):'',
   x.comp||'',x.time||'',x.p1||'',x.p2||'',
   ((x.prob||0)*100).toFixed(2),(((x.prob2??1-(x.prob||0))*100)).toFixed(2),
   x.od||'',x.od2||'',x.ev!=null?Number(x.ev).toFixed(2):'',x.ev2!=null?Number(x.ev2).toFixed(2):'',x.pick||'',x.pickOdds||'',x.pickFair?Number(x.pickFair).toFixed(2):'',x.pickEv!=null?Number(x.pickEv).toFixed(2):'',
   x.conf||'',Number(x.stake||0).toFixed(2),x.h1||'',x.h2||'',x.f1||'',x.f2||'',x.t1||'',x.t2||'',x.result||''
 ]);
 const csv='\uFEFF'+[headers,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob),aTag=document.createElement('a');
 aTag.href=url;aTag.download='liga_pro_archivio_'+new Date().toISOString().slice(0,10)+'.csv';
 document.body.appendChild(aTag);aTag.click();aTag.remove();URL.revokeObjectURL(url);
}

$('copyDiag').onclick=async()=>{
 const t=window.lastDiagnostic||'';
 if(!t){alert('Analizza prima un match.');return;}
 let ok=false;
 // Try modern clipboard API first.
 try{
   if(navigator.clipboard && window.isSecureContext){
     await navigator.clipboard.writeText(t);
     ok=true;
   }
 }catch(e){}
 // Fallback designed for local file:// HTML opened on Android/Chrome.
 if(!ok){
   try{
     const ta=document.createElement('textarea');
     ta.value=t;
     ta.setAttribute('readonly','');
     ta.style.position='fixed';
     ta.style.left='-9999px';
     ta.style.top='0';
     document.body.appendChild(ta);
     ta.focus();
     ta.select();
     ta.setSelectionRange(0,ta.value.length);
     ok=document.execCommand('copy');
     ta.remove();
   }catch(e){}
 }
 if(ok){
   const b=$('copyDiag');
   const old=b.textContent;
   b.textContent='✓ Copiata!';
   setTimeout(()=>b.textContent=old,1400);
 }else{
   // Last-resort fallback: create a selectable text area with focus.
   const ta=document.createElement('textarea');
   ta.value=t;
   ta.style.position='fixed';
   ta.style.left='10px';
   ta.style.right='10px';
   ta.style.top='20%';
   ta.style.width='calc(100% - 20px)';
   ta.style.height='45vh';
   ta.style.zIndex='99999';
   ta.style.background='#111';
   ta.style.color='#fff';
   ta.style.padding='12px';
   ta.style.border='2px solid #555';
   document.body.appendChild(ta);
   ta.focus();ta.select();
   alert('Chrome ha bloccato la copia automatica. Il testo è già selezionato: premi Copia.');
 }
};
function registraEsito(side){
  if(!window.__v24CurrentPrediction){
    alert("Prima analizza un match.");
    return;
  }
  const cur=window.__v24CurrentPrediction;
  const d=cur.d,r=cur.r,v1=cur.v1,st=cur.st;
  try{
    const actualSide=Number(side)===1?1:2;
    const predictedSide=(cur.r.p1>=cur.r.p2)?1:2;
    const modelResult=actualSide===predictedSide?"W":"L";
    addMatch(modelResult,d.p1,d.p2,r.p1,d.o1,v1?v1.ev:null,st,cur.last||{});
    const btn=document.getElementById(Number(side)===1?"win1":"win2");
    if(btn){btn.textContent="✓ Registrato";btn.disabled=true;}
  }catch(e){
    console.error(e);
    alert("Errore durante la registrazione dell'esito.");
  }
}
